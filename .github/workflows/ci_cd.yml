name: EdgeLoop CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test_and_lint:
    name: 🧪 Automated Testing & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 sqlite3

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov httpx
          pip install -e .

      - name: Run Test Suite
        env:
          EDGELOOP_CONFIG_PATH: configs/config.yaml
          PYTHONPATH: src
        run: |
          pytest tests/ -v --durations=10

  governance_verification:
    name: ⚖️ Model Governance & Regression Gates
    needs: test_and_lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 sqlite3

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Verify Champion Model Integrity
        env:
          EDGELOOP_CONFIG_PATH: configs/config.yaml
          PYTHONPATH: src
        run: |
          python -c "from edgeloop.registry.manager import ModelRegistry; reg = ModelRegistry(); champ = reg.get_champion(); assert champ is not None; print(f'Champion verified: {champ.version}')"

  build_and_deploy_check:
    name: 🚀 Build, Container & Health Verification
    needs: [test_and_lint, governance_verification]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 sqlite3

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Launch API Service & Health Check
        env:
          EDGELOOP_CONFIG_PATH: configs/config.yaml
          PYTHONPATH: src
        run: |
          python -m uvicorn edgeloop.api.app:app --host 127.0.0.1 --port 8000 &
          API_PID=$!
          echo "Waiting for API service to initialize..."
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:8000/health; then
              echo "API is healthy!"
              break
            fi
            sleep 2
          done
          curl -f http://127.0.0.1:8000/health || (echo "Health check failed" && kill $API_PID && exit 1)
          kill $API_PID
          echo "EdgeLoop Service Build & Deployment Verification Succeeded."
